name: Weekly Library Update

on:
  schedule:
    - cron: '0 0 * * 0' # Every Sunday at midnight
  workflow_dispatch: # Allow manual trigger

jobs:
  update-library:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit back to the repo
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.REPO_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests pymupdf thefuzz

      - name: Run update script
        run: |
          cd acomys_library
          python update_library.py

      - name: Check if there are new papers
        id: check_new
        run: |
          cd acomys_library
          if grep -q "NO_NEW_PAPERS" new_papers_report.txt; then
            echo "has_new=false" >> $GITHUB_OUTPUT
          else
            echo "has_new=true" >> $GITHUB_OUTPUT
            # Prepare email body
            echo "email_body<<EOF" >> $GITHUB_ENV
            cat new_papers_report.txt >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          fi

      - name: Update Deep Search Index
        if: steps.check_new.outputs.has_new == 'true'
        run: |
          cd acomys_library
          python download_pdfs.py
          python parse_pdfs.py

      - name: Refresh antibody candidate report
        run: |
          # Scan the (updated) library full text for papers with un-mined antibodies.
          # Only regenerates the candidate report for a later curated extraction pass;
          # does NOT auto-write antibody entries.
          python antibody_db/find_antibody_candidates.py

      - name: Regenerate SEO assets
        run: |
          # Rebuild sitemap, crawlable database listings, per-target pages, and
          # Dataset/publication JSON-LD from the (possibly updated) data files.
          python scripts/generate_seo.py

      - name: Check for changes and commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Commit Acomys Library updates
          cd acomys_library
          git add acomys_library.json search_index.json index.html || true
          git commit -m "Auto-update library and SEO" || echo "No changes in acomys_library"
          git push || echo "No push needed"
          cd ..
          
          # Commit Antibody DB updates
          cd antibody_db
          git add antibody_candidates.json index.html targets/ || true
          git commit -m "Auto-update candidates and SEO" || echo "No changes in antibody_db"
          git push || echo "No push needed"
          cd ..
          
          # Commit Main Repo updates (SEO files and submodule pointers)
          git add sitemap.xml publications.html acomys_library antibody_db
          git commit -m "Auto-update SEO assets and submodule pointers" || echo "No changes to commit"
          git push

      - name: Send Email Notification
        if: steps.check_new.outputs.has_new == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: "j.a.varholick@gmail.com"
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Acomys Library Weekly Update"
          to: "jvarhol2@kennesaw.edu"
          from: "Acomys Bot <j.a.varholick@gmail.com>"
          body: ${{ env.email_body }}
