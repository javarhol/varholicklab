name: Weekly Library Update

on:
  schedule:
    - cron: '0 0 * * 0' # Every Sunday at midnight
  workflow_dispatch: # Allow manual trigger
    inputs:
      force_email:
        description: 'Send the notification email even when no new papers were found (tests delivery)'
        type: boolean
        default: false

jobs:
  update-library:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit back to the repo
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.REPO_PAT }}

      - name: Sync submodules to their latest main
        env:
          PAT: ${{ secrets.REPO_PAT }}
        run: |
          # actions/checkout leaves each submodule detached at the commit the
          # parent recorded, which can lag the database's own main -- e.g. when a
          # run pushes the databases but fails before updating the pointers.
          # Starting from each database's latest main means the scripts operate on
          # current data and the push at the end fast-forwards instead of being
          # rejected. This also re-points the submodules at authenticated https
          # remotes, since .gitmodules uses ssh URLs that the runner cannot use.
          sync() {
            cd "$1"
            git remote set-url origin "https://x-access-token:$PAT@github.com/javarhol/$2.git"
            git fetch --quiet origin main
            git checkout -B main origin/main
            cd ..
          }
          sync acomys_library acomys_literature_library
          sync antibody_db acomys_antibody_database

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests pymupdf thefuzz

      - name: Run update script
        run: |
          cd acomys_library
          python update_library.py

      - name: Check if there are new papers
        id: check_new
        run: |
          cd acomys_library
          if grep -q "NO_NEW_PAPERS" new_papers_report.txt; then
            echo "has_new=false" >> $GITHUB_OUTPUT
            # Only ever sent by a manual run with force_email, to verify delivery.
            echo "email_body=No new papers found this week. This is a manually triggered delivery test." >> $GITHUB_ENV
          else
            echo "has_new=true" >> $GITHUB_OUTPUT
            # Prepare email body
            echo "email_body<<EOF" >> $GITHUB_ENV
            cat new_papers_report.txt >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          fi

      - name: Update Deep Search Index
        if: steps.check_new.outputs.has_new == 'true'
        run: |
          cd acomys_library
          python download_pdfs.py
          python parse_pdfs.py

      - name: Refresh antibody candidate report
        run: |
          # Scan the (updated) library full text for papers with un-mined antibodies.
          # Only regenerates the candidate report for a later curated extraction pass;
          # does NOT auto-write antibody entries.
          python antibody_db/find_antibody_candidates.py

      - name: Regenerate SEO assets
        run: |
          # Rebuild sitemap, crawlable database listings, per-target pages, and
          # Dataset/publication JSON-LD from the (possibly updated) data files.
          python scripts/generate_seo.py

      - name: Send Email Notification
        if: steps.check_new.outputs.has_new == 'true' || inputs.force_email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: "j.a.varholick@gmail.com"
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Acomys Library Weekly Update"
          to: "jvarhol2@kennesaw.edu"
          from: "Acomys Bot <j.a.varholick@gmail.com>"
          body: ${{ env.email_body }}

      - name: Check for changes and commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # The sync step above already put each submodule on main with an
          # authenticated remote. Pushes are NOT error-suppressed: a silent
          # failure here would leave the parent repo pointing at a submodule
          # commit that exists only on the runner.

          # Commit Acomys Library updates
          cd acomys_library
          git add acomys_library.json search_index.json index.html || true
          if git commit -m "Auto-update library and SEO"; then
            git push origin main
          else
            echo "No changes in acomys_library"
          fi
          cd ..

          # Commit Antibody DB updates
          cd antibody_db
          git add antibody_candidates.json index.html targets/ || true
          if git commit -m "Auto-update candidates and SEO"; then
            git push origin main
          else
            echo "No changes in antibody_db"
          fi
          cd ..

          # Commit Main Repo updates (SEO files and submodule pointers).
          # Runs last so the pointers it records are already on the remotes.
          #
          # REPO_PAT is scoped to the two database repos only, so it cannot push
          # here; this repo needs GITHUB_TOKEN (granted contents: write above).
          # The checkout step persisted REPO_PAT as an http.extraheader, and that
          # Authorization header overrides any credentials in the remote URL, so
          # it has to be unset before the URL token below takes effect.
          git config --local --unset-all http.https://github.com/.extraheader || true
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/javarhol/varholicklab.git"
          git add sitemap.xml publications.html acomys_library antibody_db
          git commit -m "Auto-update SEO assets and submodule pointers" || echo "No changes to commit"
          git push origin main

      - name: Alert on failure
        # The Aug 2 breakage went unnoticed because a failed run is silent unless
        # you check the Actions tab. Notify so a broken week is visible.
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: "j.a.varholick@gmail.com"
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Acomys Library Update FAILED"
          to: "jvarhol2@kennesaw.edu"
          from: "Acomys Bot <j.a.varholick@gmail.com>"
          body: |
            The weekly Acomys Library update failed.
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
