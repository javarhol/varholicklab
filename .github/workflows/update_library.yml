name: Weekly Library Update

on:
  schedule:
    - cron: '0 0 * * 0' # Every Sunday at midnight
  workflow_dispatch: # Allow manual trigger

jobs:
  update-library:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit back to the repo
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run update script
        run: python update_library.py

      - name: Check for changes and commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add acomys_library.json
          git commit -m "Auto-update Acomys library" || echo "No changes to commit"
          git push

      - name: Check if there are new papers
        id: check_new
        run: |
          if grep -q "NO_NEW_PAPERS" new_papers_report.txt; then
            echo "has_new=false" >> $GITHUB_OUTPUT
          else
            echo "has_new=true" >> $GITHUB_OUTPUT
            # Prepare email body
            echo "email_body<<EOF" >> $GITHUB_ENV
            cat new_papers_report.txt >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          fi

      - name: Send Email Notification
        if: steps.check_new.outputs.has_new == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: "j.a.varholick@gmail.com"
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Acomys Library Weekly Update"
          to: "jvarhol2@kennesaw.edu"
          from: "Acomys Bot <j.a.varholick@gmail.com>"
          body: ${{ env.email_body }}
